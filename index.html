<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bild Generator (ModelsLab API)</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 20px; background:#111; color:#eee; text-align:center; }
    h1 { margin-bottom: 8px; }
    .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin: 12px 0; }
    input, button, select { padding:10px; border-radius:8px; border:none; font-size:16px; }
    input { width: min(90vw, 420px); }
    button { background:#4cafef; color:white; font-weight:600; cursor:pointer; }
    button:hover { background:#3698d6; }
    #image { margin-top: 16px; }
    img { max-width: min(92vw, 720px); border-radius:12px; box-shadow:0 0 10px rgba(0,0,0,.5); }
    textarea { width:min(92vw, 720px); height:200px; margin:14px auto 0; display:block; font-family:monospace; border-radius:8px; border:none; padding:10px; background:#000; color:#0f0; }
    small { opacity:.8; }
  </style>
</head>
<body>
  <h1>🖼️ Bild Generator</h1>
  <small>Modell: <code>newrealityxl-global-nsfw</code> via stablediffusionapi.com</small>

  <div class="row">
    <input id="prompt" placeholder="Schreib hier deine Bild-Idee..." />
    <button id="btn">Generieren</button>
  </div>

  <div class="row">
    <select id="size">
      <option value="512x512">512×512 (schnell)</option>
      <option value="768x768">768×768</option>
      <option value="1024x1024">1024×1024</option>
    </select>
    <select id="steps">
      <option>21</option><option selected>31</option><option>41</option><option>51</option>
    </select>
    <select id="samples">
      <option selected>1</option><option>2</option><option>3</option><option>4</option>
    </select>
  </div>

  <div id="status"></div>
  <div id="image"></div>
  <textarea id="debug" placeholder="Debug-Ausgabe (API-Antworten)…" readonly></textarea>

  <script>
    // ⚠️ Hinweis: Ein API-Key im Frontend ist aus Sicherheitssicht immer sichtbar.
    // Für einen echten Produktionsbetrieb: Proxy/kleinen Backend-Server dazwischen.
    const API_KEY = "R9JFvW6IvVdgvP1SvR2N0m2LcEJGyfTSwCfjnJVkahuCHMLPqXRymaLcLL2d";
    const MODEL_ID = "newrealityxl-global-nsfw";
    const TXT2IMG_URL = "https://stablediffusionapi.com/api/v4/dreambooth";
    const FETCH_URL   = "https://stablediffusionapi.com/api/v4/dreambooth/fetch";

    const promptEl = document.getElementById("prompt");
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const imgWrap = document.getElementById("image");
    const debugEl = document.getElementById("debug");
    const sizeEl = document.getElementById("size");
    const stepsEl = document.getElementById("steps");
    const samplesEl = document.getElementById("samples");

    function setDebug(obj) {
      debugEl.value = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
    }
    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }
    function dims() {
      const [w,h] = sizeEl.value.split("x").map(Number);
      return {w, h};
    }

    async function callText2Img(prompt) {
      const {w, h} = dims();
      const body = {
        key: API_KEY,
        model_id: MODEL_ID,
        prompt,
        negative_prompt: "",
        width: w,
        height: h,
        samples: Number(samplesEl.value),
        num_inference_steps: Number(stepsEl.value),
        safety_checker: "no",
        enhance_prompt: "yes",
        guidance_scale: 7.5,
        multi_lingual: "yes",   // DE-Prompts erlauben
        temp: "yes"             // temporäre URL (Docs)
      };

      const res = await fetch(TXT2IMG_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });

      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = {raw:text}; }
      setDebug(data);
      return data;
    }

    async function fetchQueued(request_id) {
      const body = { key: API_KEY, request_id };
      const res = await fetch(FETCH_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = {raw:text}; }
      setDebug(data);
      return data;
    }

    function showImageFromData(data) {
      // laut Doku: output ist ein Array von URLs
      const url = Array.isArray(data?.output) ? data.output[0] : (data?.url || data?.image);
      if (!url) return false;
      const img = document.createElement("img");
      img.src = url;
      imgWrap.innerHTML = "";
      imgWrap.appendChild(img);
      return true;
    }

    async function generate() {
      const prompt = promptEl.value.trim();
      imgWrap.innerHTML = "";
      setDebug("");
      if (!prompt) { alert("Bitte gib eine Eingabe ein!"); return; }

      setStatus("⏳ Anfrage senden…");
      const first = await callText2Img(prompt);

      // Fälle laut Docs:
      // - status: "success" → output enthält URL(s)
      // - status: "processing" oder ähnliches → mit id / eta → poll /fetch
      // - Fehler → message/ error fields
      if (first?.status === "success" && showImageFromData(first)) {
        setStatus("✅ Fertig");
        return;
      }

      // Falls queued/processing: Polling
      const reqId = first?.id || first?.request_id;
      let tries = 0;
      if (reqId) {
        setStatus("⏳ In Warteschlange… hole Ergebnis (id: " + reqId + ") …");
        while (tries < 30) { // ~30x Poll, ~60–90s je nach Limit
          await new Promise(r => setTimeout(r, 3000));
          const got = await fetchQueued(reqId);
          if (got?.status === "success" && showImageFromData(got)) {
            setStatus("✅ Fertig");
            return;
          }
          tries++;
        }
        setStatus("❌ Timeout beim Abholen – später erneut probieren.");
        return;
      }

      // Fehlermeldung anzeigen
      setStatus("❌ Fehler – Details siehe Debug unten.");
      if (first?.message) setDebug(first);
    }

    btn.addEventListener("click", generate);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bilder App – Galerie & Einzelbild</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      text-align: center;
      background: #fafafa;
    }
    input, button, select {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    #gallery {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    #gallery img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    pre {
      margin-top: 20px;
      text-align: left;
      background: #eee;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Bildgenerator</h1>
  <p>Gib einen Prompt ein:</p>
  <input type="text" id="promptInput" placeholder="z. B. Katze mit Käse" size="40"/>
  
  <select id="modeSelect">
    <option value="single">Einzelbild</option>
    <option value="gallery">Galerie (mehrere Bilder)</option>
  </select>
  
  <button id="generateBtn">Generieren</button>

  <div id="gallery"></div>
  <pre id="debug"></pre>

  <script>
    const API_KEY = "DEIN_API_KEY_HIER"; // <-- hier dein StableDiffusionAPI Key einsetzen
    const API_URL = "https://stablediffusionapi.com/api/v3/text2img";

    const btn = document.getElementById("generateBtn");
    const input = document.getElementById("promptInput");
    const gallery = document.getElementById("gallery");
    const debug = document.getElementById("debug");
    const modeSelect = document.getElementById("modeSelect");

    btn.addEventListener("click", async () => {
      const prompt = input.value.trim();
      const mode = modeSelect.value;
      if (!prompt) {
        alert("Bitte einen Prompt eingeben!");
        return;
      }
      gallery.innerHTML = "⏳ Generiere Bild(er)...";
      debug.textContent = "";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            key: API_KEY,
            prompt: prompt,
            negative_prompt: "low quality",
            width: 512,
            height: 512,
            samples: mode === "gallery" ? 3 : 1 // Galerie = mehrere Bilder
          })
        });

        const data = await res.json();
        console.log("API Antwort:", data);
        debug.textContent = JSON.stringify(data, null, 2);

        gallery.innerHTML = "";
        if (Array.isArray(data.output)) {
          data.output.forEach(url => {
            const img = document.createElement("img");
            img.src = url;
            gallery.appendChild(img);
          });
        } else {
          gallery.innerHTML = "❌ Keine Bilder im Response gefunden";
        }
      } catch (err) {
        console.error(err);
        gallery.innerHTML = "❌ Fehler bei der Bildgenerierung";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bild Generator (ModelsLab v6)</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#111;color:#eee;margin:20px;text-align:center}
    h1{margin:8px 0}
    .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
    input,button,select{padding:10px;border-radius:8px;border:none;font-size:16px}
    input{width:min(90vw,420px)}
    button{background:#4cafef;color:#fff;font-weight:600;cursor:pointer}
    button:hover{background:#3698d6}
    img{max-width:min(92vw,720px);border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,.5);margin-top:14px}
    textarea{width:min(92vw,720px);height:220px;margin:14px auto 0;display:block;
             font-family:monospace;border-radius:8px;border:none;padding:10px;background:#000;color:#0f0}
    #status{margin-top:6px}
    small{opacity:.85}
  </style>
</head>
<body>
  <h1>🖼️ Bild Generator</h1>
  <small>Endpoint: <code>modelslab.com/api/v6/realtime/text2img</code></small>

  <div class="row">
    <input id="prompt" placeholder="Schreib hier deine Bild-Idee…" />
    <button id="btn">Generieren</button>
  </div>

  <div class="row">
    <select id="size">
      <option value="512x512">512×512</option>
      <option value="768x768">768×768</option>
      <option value="1024x1024">1024×1024</option>
    </select>
    <select id="samples">
      <option selected>1</option><option>2</option><option>3</option><option>4</option>
    </select>
  </div>

  <div id="status"></div>
  <div id="image"></div>
  <textarea id="debug" placeholder="Debug-Ausgabe …" readonly></textarea>

  <script>
    // Hinweis: Key im Frontend ist sichtbar. Für Produktion: kleinen Backend-Proxy verwenden.
    const API_KEY = "R9JFvW6IvVdgvP1SvR2N0m2LcEJGyfTSwCfjnJVkahuCHMLPqXRymaLcLL2d";
    const TXT2IMG_URL = "https://modelslab.com/api/v6/realtime/text2img";
    const FETCH_BASE  = "https://modelslab.com/api/v6/realtime/fetch/"; // + {id}

    const promptEl = document.getElementById("prompt");
    const sizeEl   = document.getElementById("size");
    const samplesEl= document.getElementById("samples");
    const btn      = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const imgWrap  = document.getElementById("image");
    const debugEl  = document.getElementById("debug");

    const setStatus = (t="") => statusEl.textContent = t;
    const setDebug  = (v) => debugEl.value = (typeof v==="string") ? v : JSON.stringify(v,null,2);
    const dims = () => { const [w,h]=sizeEl.value.split("x").map(Number); return {w,h}; };

    function showImageFromData(data){
      const url = Array.isArray(data?.output) ? data.output[0] : (data?.url || data?.image);
      if (!url) return false;
      const img = document.createElement("img");
      img.src = url;
      imgWrap.innerHTML = "";
      imgWrap.appendChild(img);
      return true;
    }

    async function text2img(prompt){
      const {w,h} = dims();
      const payload = {
        key: API_KEY,
        prompt: String(prompt),
        negative_prompt: "",
        width: String(w),
        height: String(h),
        samples: Number(samplesEl.value),
        safety_checker: false,   // falls du Filter willst: true
        seed: null,
        base64: false,
        instant_response: false, // wenn true, kommt schneller "processing"
        enhance_prompt: true
      };
      const res = await fetch(TXT2IMG_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json","Accept":"application/json"},
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      setDebug(`HTTP ${res.status} ${res.statusText}\n` + text);
      try { return JSON.parse(text); } catch { return {raw:text, statusCode:res.status}; }
    }

    async function fetchById(id){
      const res = await fetch(FETCH_BASE + encodeURIComponent(id), {
        method: "POST",
        headers: {"Content-Type":"application/json","Accept":"application/json"},
        body: JSON.stringify({ key: API_KEY })
      });
      const text = await res.text();
      setDebug(`FETCH HTTP ${res.status} ${res.statusText}\n` + text);
      try { return JSON.parse(text); } catch { return {raw:text, statusCode:res.status}; }
    }

    async function generate(){
      const prompt = promptEl.value.trim();
      imgWrap.innerHTML = ""; setDebug("");
      if (!prompt) return alert("Bitte gib eine Eingabe ein!");

      setStatus("⏳ Anfrage wird gesendet …");
      const first = await text2img(prompt);

      if (first?.status === "success" && showImageFromData(first)) {
        setStatus("✅ Fertig");
        return;
      }
      if (first?.status === "processing" && (first?.id || first?.fetch_result)) {
        const id = first.id || (first.fetch_result || "").split("/").pop();
        setStatus("⏳ In Warteschlange … (id: " + id + ")");
        for (let i=0; i<40; i++) {
          await new Promise(r => setTimeout(r, 3000));
          const got = await fetchById(id);
          if (got?.status === "success" && showImageFromData(got)) {
            setStatus("✅ Fertig");
            return;
          }
        }
        setStatus("❌ Timeout beim Abholen – bitte später erneut probieren.");
        return;
      }

      // Fehlerfall
      setStatus("❌ Fehler – Details im Debug.");
    }

    btn.addEventListener("click", generate);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bild Generator Debug</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #222; color: #eee; text-align: center; }
    textarea { width: 90%; height: 300px; margin-top: 20px; font-family: monospace; }
    input, button { padding: 10px; margin: 5px; border-radius: 6px; border: none; }
    button { background: #4cafef; color: white; cursor: pointer; }
    button:hover { background: #3698d6; }
    img { max-width: 90%; margin-top: 15px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <h1>Debug Bild Generator</h1>
  <input type="text" id="prompt" placeholder="Prompt eingeben..." size="40">
  <button onclick="generateImage()">Generieren + Debug</button>
  <div id="image-container"></div>
  <textarea id="debug-output" placeholder="API Antwort erscheint hier..." readonly></textarea>

  <script>
    async function generateImage() {
      const prompt = document.getElementById("prompt").value.trim();
      const imgDiv = document.getElementById("image-container");
      const debug = document.getElementById("debug-output");
      imgDiv.innerHTML = "";
      debug.value = "";

      if (!prompt) return alert("Bitte gib eine Eingabe ein!");

      const url = "https://stablediffusionapi.com/api/v4/dreambooth";
      const body = {
        key: "R9JFvW6IvVdgvP1SvR2N0m2LcEJGyfTSwCfjnJVkahuCHMLPqXRymaLcLL2d",
        model_id: "newrealityxl-global-nsfw",
        prompt,
        negative_prompt: "",
        width: 512,
        height: 512,
        samples: 1,
        num_inference_steps: 30,
        safety_checker: "no",
        enhance_prompt: "yes",
        guidance_scale: 7.5
      };

      debug.value = "⏳ Anfrage…";
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const text = await res.text();
        debug.value = text;  // JSON oder Fehler

        let data;
        try {
          data = JSON.parse(text);
        } catch (jsonErr) {
          console.error("JSON parse error:", jsonErr);
          return;
        }

        // Versuche Bild aus Daten zu holen
        const imgUrl = data.output?.[0] || data.url || data.image;
        if (imgUrl) {
          const img = document.createElement("img");
          img.src = imgUrl;
          imgDiv.appendChild(img);
        }
      } catch (err) {
        console.error(err);
        debug.value = "Fehler:\n" + err.toString();
      }
    }
  </script>
</body>
</html>

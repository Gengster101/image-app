<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bild Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      text-align: center;
      background: #111;
      color: #eee;
    }
    input {
      width: 80%;
      max-width: 400px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #4cafef;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #3698d6;
    }
    #image-container {
      margin-top: 20px;
      text-align: center;
      white-space: pre-wrap;
    }
    img {
      max-width: 90%;
      border-radius: 12px;
      margin-top: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <h1>🖼️ Dein Bild Generator</h1>
  <input type="text" id="prompt" placeholder="Schreib hier deine Bild-Idee...">
  <br>
  <button onclick="generateImage()">Generieren</button>
  <div id="image-container"></div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById("prompt").value.trim();
      const container = document.getElementById("image-container");
      container.innerHTML = "";
      if (!prompt) return alert("Bitte gib eine Eingabe ein!");

      const url = "https://stablediffusionapi.com/api/v4/dreambooth";
      const body = {
        key: "R9JFvW6IvVdgvP1SvR2N0m2LcEJGyfTSwCfjnJVkahuCHMLPqXRymaLcLL2d", // dein Key
        model_id: "newrealityxl-global-nsfw",
        prompt,
        negative_prompt: "",
        width: 512,
        height: 512,
        samples: 1,
        num_inference_steps: 30,
        safety_checker: "no",
        enhance_prompt: "yes",
        guidance_scale: 7.5
      };

      container.innerHTML = "⏳ Generiere Bild...";

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(`Response: ${res.statusText}`);
        const data = await res.json();
        console.log("API Antwort:", data);

        // Zeig die komplette Antwort im Browser an
        container.innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";

        // Versuch, ein Bild zu finden
        const imgUrl =
          data.output?.[0] ||
          data.output ||
          data.url ||
          data.image;

        if (imgUrl) {
          const img = document.createElement("img");
          img.src = imgUrl;
          container.innerHTML = "";
          container.appendChild(img);
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = "❌ Fehler bei der Bildgenerierung";
      }
    }
  </script>
</body>
</html>
